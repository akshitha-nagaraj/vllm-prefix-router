# The router: one pod (its routing state can't be shared between copies) and a
# normal Service so clients have a single address to send requests to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      containers:
        - name: router
          image: vllm-router:dev
          imagePullPolicy: Never # built locally and loaded with `kind load`
          env:
            - name: POLICY # round_robin | cache_aware
              value: cache_aware
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: router
spec:
  selector:
    app: router
  ports:
    - name: http
      port: 8080
      targetPort: 8080
