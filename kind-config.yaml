# Local cluster for the vLLM prefix-routing experiments.
# One node is enough: kind "nodes" are just Docker containers sharing the same VM,
# so extra nodes would add overhead without adding any real hardware.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vllm
nodes:
  - role: control-plane
    extraMounts:
      # Share a folder on the Mac with the node so downloaded model weights
      # survive pod restarts instead of being re-downloaded every time.
      - hostPath: ./hf-cache
        containerPath: /hf-cache
